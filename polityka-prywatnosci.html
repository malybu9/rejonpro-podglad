<!DOCTYPE html>
<!-- Okno hasła podglądu RejonPro. Na podstawie szablonu StatiCrypt (licencja MIT). znacznik logo podmienia build.mjs. -->
<html class="staticrypt-html" lang="pl">
    <head>
        <meta charset="utf-8" />
        <title>Podgląd strony</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#042351" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #036bd2;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #036bd2;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f5f8fc;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* ---- RejonPro ---- */
            .staticrypt-content {
                background: radial-gradient(700px 420px at 85% -10%, #dcebfc 0%, rgba(220, 235, 252, 0) 65%),
                    linear-gradient(180deg, #ffffff 0%, #f5f8fc 100%);
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
                color: #0b1b33;
                min-height: 100%;
                margin: 0;
            }
            .staticrypt-page { width: auto; max-width: 400px; padding: 12vh 16px 0; }
            .staticrypt-form {
                max-width: none;
                padding: 36px 32px 32px;
                border: 1px solid #dce5f0;
                border-radius: 24px;
                box-shadow: 0 32px 64px -24px rgba(4, 35, 81, 0.35);
                text-align: left;
            }
            .rp-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
            .rp-brand img { width: 42px; height: auto; }
            .rp-brand span { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.03em; line-height: 1; }
            .rp-rejon { color: #042351; }
            .rp-pro { color: #036bd2; }
            .staticrypt-instructions { margin: 0; }
            .staticrypt-title { font-size: 1.35rem; font-weight: 700; color: #042351; margin: 0 0 8px; }
            .staticrypt-instructions p:last-child { margin: 0; color: #33475f; line-height: 1.5; }
            .staticrypt-hr { border-top-color: #dce5f0; margin: 24px 0; }
            .staticrypt-password-container { background: #f5f8fc; border: 1px solid #c7d4e5; border-radius: 12px; }
            .staticrypt-password-container:focus-within { border-color: #036bd2; box-shadow: 0 0 0 4px rgba(3, 107, 210, 0.15); background: #ffffff; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { font-size: 16px; padding: 14px 48px 14px 14px; color: #0b1b33; }
            label.staticrypt-remember { font-size: 0.95rem; color: #33475f; gap: 4px; }
            .staticrypt-remember input[type="checkbox"] { transform: none; width: 20px; height: 20px; margin: 0 10px 0 0; accent-color: #036bd2; }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                border-radius: 999px;
                font-size: 1rem;
                font-weight: 600;
                min-height: 52px;
                background: linear-gradient(135deg, #1b82e6, #036bd2 55%, #0356aa);
                box-shadow: 0 8px 20px -8px rgba(3, 107, 210, 0.6);
            }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible { outline: 3px solid #1b82e6; outline-offset: 3px; }
            .rp-error { margin: 0 0 14px; color: #b42318; font-weight: 600; font-size: 0.95rem; }
            .rp-error[hidden] { display: none; }
            .staticrypt-spinner { border-color: #036bd2; border-right-color: transparent; }
        </style>
    </head>
